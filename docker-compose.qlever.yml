# GEMEA: QLever + SHMARQL + MCPO, aligned with the hosted deployment.
#
# Configuration: cp config.env.example config.env and edit.
#
# 1. Build the QLever index once from the downloaded .nq files (README §5.2):
#      docker compose --env-file config.env -f docker-compose.qlever.yml run --rm qlever-index
# 2. Start the services:
#      docker compose --env-file config.env -f docker-compose.qlever.yml up -d --wait
#
# All ports bind to 127.0.0.1 only. To serve publicly, put a reverse proxy
# with TLS in front of SHMARQL; do not expose QLever, Redis, or MCPO directly.
#
# SHMARQL UI:      http://localhost:${SHMARQL_PORT:-2342}
# SPARQL endpoint: http://localhost:${QLEVER_PORT:-2343}
# MCPO (MCP→HTTP): http://localhost:${MCPO_PORT:-2344}

services:
  # One-off index build; only runs with `run --rm qlever-index`.
  qlever-index:
    image: docker.io/adfreiburg/qlever:latest
    profiles: ["index"]
    init: true
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /index
    volumes:
      - ${NQ_INPUT_DIR:?set NQ_INPUT_DIR in config.env}:/input:ro
      - ${INDEX_DIR:?set INDEX_DIR in config.env}:/index
    environment:
      - INDEX_NAME=${INDEX_NAME:-gemea}
      - NQ_INPUT_GLOB=${NQ_INPUT_GLOB:-*.nq}
      - INDEX_MEMORY=${INDEX_MEMORY:-10G}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        shopt -s nullglob
        FILES=(/input/$${NQ_INPUT_GLOB})
        if [ $${#FILES[@]} -eq 0 ]; then
          echo "ERROR: no files matched /input/$${NQ_INPUT_GLOB}" >&2
          exit 1
        fi
        echo "Indexing $${#FILES[@]} file(s) into /index/$${INDEX_NAME}"

        cat > /index/settings.json << 'SETTINGS'
        {
          "num-triples-per-batch": 500000,
          "parser-batch-size": 50000,
          "ascii-prefixes-only": false,
          "languages-internal": ["de", "en", ""],
          "prefixes-external": [
            "http://www.deutsche-digitale-bibliothek.de/item/",
            "http://www.deutsche-digitale-bibliothek.de/organization/",
            "urn:edm:Aggregation:",
            "urn:edm:ProvidedCHO:",
            "http://www.deutschefotothek.de/documents/obj/",
            "http://fotothek.slub-dresden.de/",
            "http://www.europeana.eu/schemas/edm/",
            "http://www.w3.org/"
          ]
        }
        SETTINGS

        ARGS=()
        for f in "$${FILES[@]}"; do ARGS+=(-f "$$f" -F nq); done
        qlever-index -i "$${INDEX_NAME}" "$${ARGS[@]}" -W -m "$${INDEX_MEMORY}" \
          -s settings.json 2>&1 | tee "$${INDEX_NAME}.index-log.txt"
        echo "=== Index built: /index/$${INDEX_NAME} ==="

  qlever:
    image: docker.io/adfreiburg/qlever:latest
    restart: unless-stopped
    init: true
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /index
    volumes:
      - ${INDEX_DIR:?set INDEX_DIR in config.env}:/index
    ports:
      - "127.0.0.1:${QLEVER_PORT:-2343}:7019"
    environment:
      - INDEX_NAME=${INDEX_NAME:-gemea}
      - QLEVER_MEMORY=${QLEVER_MEMORY:-50G}
      - QLEVER_CACHE=${QLEVER_CACHE:-15G}
      - QLEVER_CACHE_ENTRY=${QLEVER_CACHE_ENTRY:-5G}
      - QLEVER_THREADS=${QLEVER_THREADS:-8}
      - QLEVER_TIMEOUT=${QLEVER_TIMEOUT:-60s}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        exec qlever-server -i "$${INDEX_NAME}" -j "$${QLEVER_THREADS}" -p 7019 \
          -m "$${QLEVER_MEMORY}" -c "$${QLEVER_CACHE}" -e "$${QLEVER_CACHE_ENTRY}" -k 200 \
          -s "$${QLEVER_TIMEOUT}" -t
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7019/?cmd=stats"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  redis:
    image: docker.io/library/redis:alpine
    restart: unless-stopped

  shmarql:
    image: ghcr.io/epoz/shmarql:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SHMARQL_PORT:-2342}:8000"
    environment:
      - ENDPOINT=http://qlever:7019/
      - REDIS_HOST=redis
      - SITE_TITLE=${SITE_TITLE:-German Memory Atlas}
    depends_on:
      redis:
        condition: service_started
      qlever:
        condition: service_healthy

  mcpo:
    image: ghcr.io/open-webui/mcpo:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCPO_PORT:-2344}:8001"
    command: >
      --port 8001 --
      npx -y mcp-server-qlever
      -e http://qlever:7019
    depends_on:
      qlever:
        condition: service_healthy
